plugins {
    id 'dev.kikugie.stonecutter'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0' apply false
    id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
}

// nexus-publish 只能作用于 root project（插件内强制检查），per-node 的发布配置见 build.gradle。
apply plugin: 'io.github.gradle-nexus.publish-plugin'

nexusPublishing {
    // Stonecutter 布局下 root 无 group，显式指定 staging profile 归属的包组。
    packageGroup = 'io.github.tt432'
    repositories {
        sonatype {
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
            username = project.findProperty('ossrhUsername')
            password = project.findProperty('ossrhPassword')
        }
    }
}

stonecutter.active '1.20.1'

stonecutter.handlers {
    inherit 'java', 'json'
}
