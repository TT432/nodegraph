// Stonecutter 0.9 centralScript: 此脚本对每个 version node (:1.20.1, :1.21.1, :26.1.2) 各跑一次。
// root project 的构建脚本见 stonecutter.gradle（nexus-publish 只能作用于 root）。
// 版本比较用 sc.current.parsed.matches（0.8+ API，替代旧 stonecutter.eval）。
plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'net.darkhax.curseforgegradle'
}

def isLegacyForge = sc.current.parsed.matches '<1.20.6'
def isModern = sc.current.parsed.matches '>=26.1'

// Stonecutter 常量：源码中用 //? if legacy / //? if modern 做三路分支
stonecutter {
    constants['legacy'] = isLegacyForge
    constants['modern'] = isModern
}

// Stonecutter centralScript 不自动替换 sourceSet（0.7-0.9 均如此）：compileJava 默认编译 src/main/java，
// 加了 //? 注释后原始源码有裸露的 else 分支会导致语法错误。
// 必须让 sourceSet 指向 stonecutterGenerate 的生成目录。
def stonecutterMainBase = layout.buildDirectory.dir('generated/stonecutter/main')
sourceSets.main.java.srcDirs = [stonecutterMainBase.map { it.dir('java') }]
sourceSets.main.resources.srcDirs = [stonecutterMainBase.map { it.dir('resources') }]
compileJava.dependsOn 'stonecutterGenerate'
processResources.dependsOn 'stonecutterGenerate'

// 同理，test sourceSet 也需指向 stonecutterGenerateTest 的生成目录。
def stonecutterTestGenerated = layout.buildDirectory.dir('generated/stonecutter/test/java')
sourceSets.test.java.srcDirs = [stonecutterTestGenerated]
compileTestJava.dependsOn 'stonecutterGenerateTest'

if (isLegacyForge) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
    apply plugin: 'net.neoforged.moddev'
}

// 每个 node 发布各自带 MC 版本 + loader 后缀的版本号。
version = "${mod_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "ForgeMaven"
        url = "https://maven.minecraftforge.net/"
    }
}

base {
    archivesName = mod_id
}

// per-version Java 版本来自 stonecutter.properties.toml（17 / 21 / 25）。
java.toolchain.languageVersion = JavaLanguageVersion.of(property('java_version') as int)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (isLegacyForge) {
    legacyForge {
        // Specify the version of MinecraftForge to use.
        // Format: minecraft_version-forge_version, e.g. "1.20.1-47.3.0"
        version = project.minecraft_version + '-' + project.forge_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        // Default run configurations.
        runs {
            client {
                client()

                // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            // applies to all the run configs above
            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version

        // 26.1+ 已去混淆，无需 parchment
        if (!isModern) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Expose Minecraft/Forge classes (output of createMinecraftArtifacts) to
    // the test source set; ModDevGradle only wires them into 'main'.
    testCompileClasspath.extendsFrom(modDevCompileDependencies)
    testRuntimeClasspath.extendsFrom(modDevCompileDependencies)
}

dependencies {
    // JUnit 5 for pure-Java unit tests (data model, engine, commands, clipboard).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : findProperty('forge_version') ?: '',
            forge_version_range    : findProperty('forge_version_range') ?: '',
            loader_version_range   : findProperty('loader_version_range') ?: '',
            neoforge_version       : findProperty('neoforge_version') ?: '',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from stonecutterMainBase.map { it.dir('templates') }
    // NeoForge 1.20.6+ requires neoforge.mods.toml; Forge 1.20.1 requires mods.toml
    if (isLegacyForge) {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'META-INF/mods.toml'
    }
    into "build/generated/sources/modMetadata"
}
generateModMetadata.configure { dependsOn 'stonecutterGenerate' }
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
if (isLegacyForge) {
    legacyForge.ideSyncTask generateModMetadata
} else {
    neoForge.ideSyncTask generateModMetadata
}

// Stonecutter //? 预处理输出（build/generated/stonecutter/）被 ModDevGradle createMinecraftArtifacts 读取，
// 需显式声明 task 依赖，否则 Gradle 8+ task validation 报 implicit_dependency 错误。
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    dependsOn tasks.matching { it.name == 'stonecutterGenerate' }
}

// ---- Maven Central publishing (Central Publisher Portal via OSSRH Staging API) ----
// OSSRH 已于 2025-06-30 EOL；改用 Central Publisher Portal 的 OSSRH Staging API 兼容服务。
// 凭据（Central Portal User Token）存于 ~/.gradle/gradle.properties 的 ossrhUsername/ossrhPassword。
// nexusPublishing 配置在 root 的 stonecutter.gradle；root 的 publishToSonatype 聚合所有 node 的发布。
java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc', Javadoc).configure {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

signing {
    sign publishing.publications
}

// dev classifier jar（仅 legacyforge 需要）：mavenJava 主产物被 ModDevGradle reobfuscate 替换为 SRG jar
// （面向生产 runtime/CurseForge）；但 MDG dev runtime 是 mojmap，消费方 dev 环境直接用主产物会
// NoSuchMethodError（SRG 名）。dev jar = mojmap 字节码，保留 mods.toml——消费方经 localRuntime
// 注册进 FML mod discovery，类才进入 FML 模块层对 mod 代码可见（dev 的 TransformingClassLoader
// 看不到裸 -classpath 上的 jar）。
def devJar = tasks.register('devJar', Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // stonecutter node 的 project.name 是版本号（1.20.1/...），artifactId 必须显式固定为 mod_id，
            // 否则发布坐标变成 io.github.tt432:<版本号>:...，消费方无法按 nodegraph 名称解析。
            artifactId = mod_id
            from components.java
            if (isLegacyForge) {
                artifact devJar
            }
            pom {
                name = mod_name
                description = mod_description
                url = "https://github.com/${githubUserName}/${githubRepoName}"
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/${githubUserName}/${githubRepoName}.git"
                    developerConnection = "scm:git:ssh://github.com/${githubUserName}/${githubRepoName}.git"
                    url = "https://github.com/${githubUserName}/${githubRepoName}"
                }
                developers {
                    developer {
                        id = githubUserName
                        name = githubUserName
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---- CurseForge 发布 (CurseForgeGradle 1.3.33)，per-node ----
// 为什么用这个插件：已归档的 CurseGradle(matthewprenger,1.4.0/2019) 不兼容 Gradle 9；
// CurseForgeGradle 1.1.15 的 HTTP 客户端被 CurseForge 的 Cloudflare bot 防护 403 拦截（Issue #22 未修复）；
// 1.3.33 修了该问题，但要求 daemon JVM >= 25。
//
// 发布：./scripts/publish-curseforge.ps1（自动探测 Java 25 并设 org.gradle.java.home）
//   或手动：./gradlew :<version>:publishCurseForge -Dorg.gradle.java.home=<jdk25 路径>
// 鉴权：CURSE_TOKEN 存于 ~/.gradle/gradle.properties。
//
// disableVersionDetection：ModDevGradle 依赖 net.neoforged.moddev，自动检测会误标 NeoForge，故手动指定
//   game/modloader/java/environment。environment 为 CurseForge 2026-07-15 起的强制要求。
// 闭包内 delegate 是 Task，property('java_version') 会查 Task 扩展而报 unknown property；
// 所有 per-version 值必须在 tasks.register 闭包外捕获。
def curseArtifactTask = isLegacyForge ? tasks.named('reobfJar') : tasks.named('jar')
def curseGameVersion = minecraft_version
def curseModLoader = isLegacyForge ? 'Forge' : 'NeoForge'
def curseJavaVersion = "Java ${property('java_version')}"
tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    // legacyforge 的 jar 任务只产出 dev jar（build/devlibs/），游戏无法直接加载，必须上传
    // reobfJar 产物（build/libs/*.jar）；neoforge 无需 reobf，jar 产物直接可加载。
    dependsOn curseArtifactTask
    // CurseForgeGradle 持有 Project 引用，与 Gradle configuration-cache 不兼容。
    notCompatibleWithConfigurationCache('CurseForgeGradle is not configuration-cache compatible')
    apiToken = findProperty('CURSE_TOKEN')

    def mainFile = upload('1601245', curseArtifactTask.get())
    mainFile.changelog = rootProject.file('CHANGELOG_CF.md')
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    // disableVersionDetection 是任务级方法（对本次上传的所有文件禁用自动检测）。
    disableVersionDetection()
    mainFile.addGameVersion curseGameVersion
    mainFile.addModLoader curseModLoader
    mainFile.addJavaVersion curseJavaVersion
    mainFile.addEnvironment 'Client', 'Server'
}
